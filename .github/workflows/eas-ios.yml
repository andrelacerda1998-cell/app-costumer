# Build + (opcional) submit da app iOS via EAS, disparado à mão.
#
# Pré-requisitos:
#   - Secret  EXPO_TOKEN          (robô ci-builds da org piquet-technologies) — já colocado
#   - Variable EAS_PROJECT_ID     (id do projeto criado por `eas init` na org nova;
#                                  Settings → Secrets and variables → Actions → Variables)
#   - Credenciais iOS no EAS      (`eas credentials --platform ios`, uma vez, em modo
#                                  interativo): certificado e perfil para o BUILD, e a
#                                  chave da App Store Connect para o SUBMIT.
#
# Os secrets ASC_KEY_BASE64 / ASC_KEY_ID / ASC_ISSUER_ID deixaram de ser usados —
# a chave passou a viver no EAS. Podem ser removidos do repositório.
#
# O projeto EAS é criado UMA vez com `eas init` local (não no CI — o config é dinâmico
# e o init não persiste o id, ver eas-cli#1301). Aqui o build é determinístico: só build.
name: EAS iOS (customer)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Perfil EAS (eas.json)"
        default: "production"
      submit:
        description: "Submeter ao TestFlight depois do build"
        type: boolean
        default: true

jobs:
  ios:
    runs-on: ubuntu-latest
    env:
      EAS_OWNER: piquet-technologies
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      # O app.config.ts é dinâmico e resolve o bundle id a partir do APP_ENV.
      # O build recebe-o do perfil EAS (--profile), mas o `eas submit` avalia o
      # config localmente: sem APP_ENV caía no bundle de development
      # (…customer.development) e não encontrava a chave ASC (guardada no bundle
      # de produção) → "App Store Connect API Keys cannot be set up". Fixa-o ao
      # perfil escolhido para os dois passos resolverem o mesmo bundle id.
      APP_ENV: ${{ inputs.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verificar EAS_PROJECT_ID
        run: |
          test -n "$EAS_PROJECT_ID" || { echo "::error::Falta a variable EAS_PROJECT_ID (corre 'eas init' localmente e mete o id)"; exit 1; }

      - name: Instalar dependências
        run: yarn install --frozen-lockfile

      - name: Build iOS
        run: |
          WAIT_FLAG="--no-wait"
          [ "${{ inputs.submit }}" = "true" ] && WAIT_FLAG="--wait"
          npx eas-cli@latest build --platform ios --profile "${{ inputs.profile }}" --non-interactive $WAIT_FLAG

      # A chave da App Store Connect vive no EAS, não aqui.
      #
      # Isto passava a chave por flags — `--asc-api-key-path`, `--asc-api-key-id`
      # e `--asc-api-key-issuer-id` — que a eas-cli deixou de ter. O passo
      # falhava sempre, mesmo que o build tivesse corrido.
      #
      # O caminho documentado para CI é guardar a chave no EAS com
      # `eas credentials --platform ios`: a partir daí o `submit` usa-a sozinho,
      # e a chave privada nunca passa pelo repositório nem pelos secrets do
      # GitHub.
      #
      # PRÉ-REQUISITO: a chave tem de estar carregada no EAS. Enquanto não
      # estiver, este passo falha — e é suposto falhar de forma barulhenta.
      - name: Submeter ao TestFlight
        if: ${{ inputs.submit }}
        run: npx eas-cli@latest submit --platform ios --latest --non-interactive
