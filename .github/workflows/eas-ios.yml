# Build + (opcional) submit da app iOS via EAS, disparado à mão.
#
# Pré-requisitos:
#   - Secret  EXPO_TOKEN          (robô ci-builds da org piquet-technologies) — já colocado
#   - Secret  ASC_KEY_BASE64      (.p8 da App Store Connect API em base64)
#   - Secret  ASC_KEY_ID          (348L9SN7ZZ)
#   - Secret  ASC_ISSUER_ID       (f0090ce9-…)
#   - Variable EAS_PROJECT_ID     (id do projeto criado por `eas init` na org nova;
#                                  Settings → Secrets and variables → Actions → Variables)
#
# O projeto EAS é criado UMA vez com `eas init` local (não no CI — o config é dinâmico
# e o init não persiste o id, ver eas-cli#1301). Aqui o build é determinístico: só build.
name: EAS iOS (customer)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Perfil EAS (eas.json)"
        default: "production"
      submit:
        description: "Submeter ao TestFlight depois do build"
        type: boolean
        default: true

jobs:
  ios:
    runs-on: ubuntu-latest
    env:
      EAS_OWNER: piquet-technologies
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verificar EAS_PROJECT_ID
        run: |
          test -n "$EAS_PROJECT_ID" || { echo "::error::Falta a variable EAS_PROJECT_ID (corre 'eas init' localmente e mete o id)"; exit 1; }

      - name: Instalar dependências
        run: yarn install --frozen-lockfile

      - name: Build iOS
        run: |
          WAIT_FLAG="--no-wait"
          [ "${{ inputs.submit }}" = "true" ] && WAIT_FLAG="--wait"
          npx eas-cli@latest build --platform ios --profile "${{ inputs.profile }}" --non-interactive $WAIT_FLAG

      - name: Preparar chave ASC
        if: ${{ inputs.submit }}
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: printf '%s' "$ASC_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/asc_key.p8"

      - name: Submeter ao TestFlight
        if: ${{ inputs.submit }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          npx eas-cli@latest submit --platform ios --latest --non-interactive \
            --asc-api-key-path "$RUNNER_TEMP/asc_key.p8" \
            --asc-api-key-id "$ASC_KEY_ID" \
            --asc-api-key-issuer-id "$ASC_ISSUER_ID"
